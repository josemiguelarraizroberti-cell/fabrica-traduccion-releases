name: Publicar actualización
on:
  push:
    paths:
      - "artifacts/ACTUALIZACION_FABRICA_0.17.1.zip.b64.part*"
      - ".github/workflows/publicar-actualizacion.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruir y verificar el paquete
        shell: bash
        run: |
          cat artifacts/ACTUALIZACION_FABRICA_0.17.1.zip.b64.part* | base64 --decode > ACTUALIZACION_FABRICA_0.17.1.zip
          echo "5643faae87dcac48db8ee66f57a351d26084a0a05e187ec75ba4fb762aed70e8  ACTUALIZACION_FABRICA_0.17.1.zip" | sha256sum --check
      - name: Publicar la versión
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view v0.17.1 >/dev/null 2>&1; then
            gh release create v0.17.1 --title "Fábrica de Traducción 0.17.1" --notes "Mantiene visibles los botones de decisión con el escalado alto de Windows."
          fi
          gh release upload v0.17.1 ACTUALIZACION_FABRICA_0.17.1.zip --clobber
      - name: Publicar aviso para la aplicación
        shell: bash
        run: |
          cat > latest.json <<'JSON'
          {
            "version": "0.17.1",
            "download_url": "https://github.com/josemiguelarraizroberti-cell/fabrica-traduccion-releases/releases/download/v0.17.1/ACTUALIZACION_FABRICA_0.17.1.zip",
            "sha256": "5643faae87dcac48db8ee66f57a351d26084a0a05e187ec75ba4fb762aed70e8",
            "notes": "Corrige la ventana de revisión para mantener visibles Aceptar, Rechazar y Aplicar aceptadas."
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git diff --cached --quiet || git commit -m "Publicar manifiesto de la versión 0.17.1"
          git push
