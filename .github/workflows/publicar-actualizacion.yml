name: Publicar actualización

on:
  push:
    paths:
      - "artifacts/ACTUALIZACION_FABRICA_0.12.zip.b64"
      - ".github/workflows/publicar-actualizacion.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruir y verificar el paquete
        shell: bash
        run: |
          base64 --decode artifacts/ACTUALIZACION_FABRICA_0.12.zip.b64 > ACTUALIZACION_FABRICA_0.12.zip
          echo "3314da325005acba08d8808a6bd3e4840c4447ef1c3bfc3aa7f87f4c29cc3884  ACTUALIZACION_FABRICA_0.12.zip" | sha256sum --check
      - name: Publicar la versión
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view v0.12.0 >/dev/null 2>&1; then
            gh release create v0.12.0 --title "Fábrica de Traducción 0.12" --notes "Conformación bíblica automática, pausable y protegida contra excepciones doctrinales."
          fi
          gh release upload v0.12.0 ACTUALIZACION_FABRICA_0.12.zip --clobber
      - name: Publicar aviso para la aplicación
        shell: bash
        run: |
          cat > latest.json <<'JSON'
          {
            "version": "0.12.0",
            "download_url": "https://github.com/josemiguelarraizroberti-cell/fabrica-traduccion-releases/releases/download/v0.12.0/ACTUALIZACION_FABRICA_0.12.zip",
            "sha256": "3314da325005acba08d8808a6bd3e4840c4447ef1c3bfc3aa7f87f4c29cc3884",
            "notes": "Conforma todas las citas bíblicas en orden, guarda cada una y se detiene ante referencias ambiguas o posibles excepciones doctrinales."
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git diff --cached --quiet || git commit -m "Publicar manifiesto de la versión 0.12"
          git push
