name: Publicar actualización
on:
  push:
    paths:
      - "artifacts/ACTUALIZACION_FABRICA_0.15.zip.b64"
      - ".github/workflows/publicar-actualizacion.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruir y verificar el paquete
        shell: bash
        run: |
          base64 --decode artifacts/ACTUALIZACION_FABRICA_0.15.zip.b64 > ACTUALIZACION_FABRICA_0.15.zip
          echo "51f35c9fbefde328743116aebdc0ba202d858f7a3a8bb3b41f77496ebec79cb0  ACTUALIZACION_FABRICA_0.15.zip" | sha256sum --check
      - name: Publicar la versión
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view v0.15.0 >/dev/null 2>&1; then
            gh release create v0.15.0 --title "Fábrica de Traducción 0.15" --notes "Reparación completa de estados multipárrafo y ejecución silenciosa de Codex."
          fi
          gh release upload v0.15.0 ACTUALIZACION_FABRICA_0.15.zip --clobber
      - name: Publicar aviso para la aplicación
        shell: bash
        run: |
          cat > latest.json <<'JSON'
          {
            "version": "0.15.0",
            "download_url": "https://github.com/josemiguelarraizroberti-cell/fabrica-traduccion-releases/releases/download/v0.15.0/ACTUALIZACION_FABRICA_0.15.zip",
            "sha256": "51f35c9fbefde328743116aebdc0ba202d858f7a3a8bb3b41f77496ebec79cb0",
            "notes": "Completa la reparación de citas multipárrafo parcialmente conformadas y oculta las ventanas de consola de Codex."
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git diff --cached --quiet || git commit -m "Publicar manifiesto de la versión 0.15"
          git push
